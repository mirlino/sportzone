<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="SportZone, complejo multideportivo">
  <!-- Escudo deportivo izquierdo -->
  <g transform="translate(8, 8)">
    <!-- Contorno exterior del escudo -->
    <path d="M40 2 L76 14 V40 C76 62 56 76 40 82 C24 76 4 62 4 40 V14 Z" fill="#FFFFFF" stroke="#065F46" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Divisiones internas de las 4 disciplinas -->
    <!-- Cuadrante superior izquierdo: Futbol (blanco y verde oscuro) -->
    <path d="M40 6 L10 17 V39 H40 Z" fill="#F8FAFC" stroke="#065F46" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/>
    <polygon points="24,18 28.5,21.5 26.8,26.8 21.2,26.8 19.5,21.5" fill="#065F46"/>
    <line x1="24" y1="14" x2="24" y2="18" stroke="#065F46" stroke-width="1.5"/>
    <line x1="15" y1="21" x2="19.5" y2="21.5" stroke="#065F46" stroke-width="1.5"/>
    <line x1="33" y1="21" x2="28.5" y2="21.5" stroke="#065F46" stroke-width="1.5"/>

    <!-- Cuadrante superior derecho: Golf (lima) -->
    <path d="M40 6 L70 17 V39 H40 Z" fill="#84CC16" stroke="#065F46" stroke-width="1.5"/>
    <line x1="53" y1="14" x2="53" y2="34" stroke="#065F46" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="53,14 66,19 53,24" fill="#065F46"/>
    <circle cx="59" cy="34" r="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.2"/>

    <!-- Cuadrante inferior izquierdo: Voleibol (esmeralda) -->
    <path d="M10 39 H40 V76 C24 70 10 57 10 39 Z" fill="#10B981" stroke="#065F46" stroke-width="1.5"/>
    <path d="M13 48 Q25 44 37 52" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M16 56 Q27 52 38 60" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M24 41 Q29 55 24 67" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Cuadrante inferior derecho: Baloncesto (verde profundo) -->
    <path d="M40 39 H70 C70 57 56 70 40 76 Z" fill="#065F46" stroke="#065F46" stroke-width="1.5"/>
    <path d="M43 52 Q55 46 66 54" fill="none" stroke="#84CC16" stroke-width="2"/>
    <path d="M42 62 Q54 57 62 64" fill="none" stroke="#84CC16" stroke-width="2"/>
    <path d="M54 41 Q49 56 54 70" fill="none" stroke="#84CC16" stroke-width="2"/>
  </g>

  <!-- Marca tipografica SportZone -->
  <text x="100" y="54" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" font-style="italic" letter-spacing="-1">
    <tspan fill="#065F46">Sport</tspan><tspan fill="#10B981">Zone</tspan>
  </text>

  <!-- Descriptor -->
  <text x="102" y="76" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.8" fill="#0F172A">
    COMPLEJO MULTIDEPORTIVO
  </text>
</svg>
